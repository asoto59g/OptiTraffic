[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "optitraffic"
version = "0.2.0"
description = "Urban traffic simulator (Streamlit + SUMO + TomTom + OSM)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "ABC Geomática / OptiTraffic" }]
dependencies = [
    "streamlit>=1.28.0,<2",
    "geopandas>=0.14.0,<2",
    "shapely>=2.0.0,<3",
    "folium>=0.15.0,<0.20",
    "streamlit-folium>=0.18.0,<0.30",
    "geopy>=2.4.0,<3",
    "requests>=2.31.0,<3",
    "mapbox-vector-tile>=2.0.0,<3",
    "python-dotenv>=1.0.0,<2",
    "osmium>=3.7.0,<5",
    "pyproj>=3.6.0,<4",
    "pandas>=2.1.0,<3",
    "numpy>=1.26.0,<3",
    "lxml>=4.9.0,<6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9",
    "ruff>=0.6.0,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "ui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: needs SUMO, TomTom, or network (skipped in default CI)",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "ui", "tests", "app.py"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",
    "E402",
]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E402"]
"ui/*.py" = ["E402"]
"scripts/*" = ["E402"]
